name: NuGet Publish

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Run tests'
        required: false
        type: boolean
        default: true

jobs:
  build:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore  --nowarn:CS1591
    - name: Test
      if: ${{ inputs.tests }}
      env:
        LOL__APIKEY: ${{ secrets.LOL__APIKEY }}
        LOR__APIKEY: ${{ secrets.LOR__APIKEY }}
        TFT__APIKEY: ${{ secrets.TFT__APIKEY }}
      run: dotnet test --no-build --verbosity normal
    - name: Pack
      run: dotnet pack -c Release
    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC ? temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: NuGet push
      run: dotnet nuget push --skip-duplicate --api-key ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json ./artifacts/package/release/*.nupkg
      
